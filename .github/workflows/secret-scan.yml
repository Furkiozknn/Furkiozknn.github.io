# Server-side secret scan (backstop for the local pre-push hook).
# The hook can be skipped (--no-verify, web edits, API writes, cloud
# sessions), and GitHub push protection is not available for private repos
# on a personal plan, so every pushed range is re-scanned here with gitleaks
# (MIT). The binary is pinned and checked against the official release
# checksum. Findings are redacted and fail the job.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    # Commits of a same-repo PR were already scanned by their push run;
    # only fork PRs need their own run (saves Actions minutes).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full commit history but no file contents up front; git fetches
          # only the blobs that the scanned range's diffs need.
          fetch-depth: 0
          filter: blob:none

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the pushed range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$BEFORE" != "$zero" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            # New ref, or a force-push over a commit that is gone: scan the
            # commits that no other branch already has.
            # gitleaks splits --log-opts on single spaces, so keep exactly one
            # space between items (a stray space becomes an empty git arg).
            others=$(git for-each-ref --format='%(refname)' refs/remotes/origin \
              | grep -vxF -e "refs/remotes/origin/${GITHUB_REF_NAME}" -e refs/remotes/origin/HEAD \
              | paste -sd' ' - || true)
            if [ -n "$others" ]; then
              range="$AFTER --not $others"
            else
              range="$AFTER"
            fi
          fi
          echo "Commits in range: $(git rev-list --count $range)"
          echo "Range: $range"
          log="$RUNNER_TEMP/gitleaks.log"
          set +e
          "$RUNNER_TEMP/gitleaks" git --no-banner --no-color --redact -v --exit-code 1 \
            --log-opts="$range" . 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          # gitleaks logs git failures as ERR but still exits 0: fail closed.
          if grep -q ' ERR ' "$log"; then
            echo "::error::gitleaks reported an error, the range was not scanned"
            exit 2
          fi
          exit "$rc"
