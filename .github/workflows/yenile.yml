name: Yenile

# The page is a view of the metadata in the other repositories, so it is rebuilt
# on a schedule rather than edited. A run that produces no diff commits nothing.
on:
  schedule:
    - cron: "20 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["uret.py", ".github/workflows/yenile.yml"]

permissions:
  contents: write

concurrency:
  group: yenile
  cancel-in-progress: false

jobs:
  yenile:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 24 sn
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild from every repository's project-meta.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 uret.py
      - name: Commit only if something actually changed
        run: |
          set -eu
          if [ -z "$(git status --porcelain)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: rebuild the directory from the live metadata"
          git push
      - name: Summary
        run: |
          {
            echo "### Project directory"
            echo ""
            python3 -c "import json;d=json.load(open('veri/projeler.json',encoding='utf-8'));print(f\"{len(d['projects'])} projects, generated {d['generated']}\")"
          } >> "$GITHUB_STEP_SUMMARY"
