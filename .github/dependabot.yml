# Ayda bir, ekosistem basina TEK PR (groups). Her paket icin ayri PR,
# 25 Eylul 2026'da hesapta 36 acik Dependabot PR'i demekti; upload/download-
# artifact gibi birlikte yukselmesi gereken ciftler de ayni PR'da kalir.
# Kural: schema/politika.py (profile repository, private)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Yeni yayimlanan surum 7 gun bekler (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
