<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Furki Özkan - agent infrastructure, MCP and developer tooling. 28 public repositories, 5,247 tests.">
  <!-- Koyu tema. Acik tema: hero-light.svg; ikisi ayni cizim.
       Sayilarin id'si var (sayi-repos, sayi-tests) ve
       "N with suites" etiketi: schema/testler.py iki hero'yu da oradan
       gunceller; kontrol modu ikisine de bakar. Metin sistem fontlariyla
       ciziliyor: GitHub SVG icindeki dis fontlari yuklemez. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18171e"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4f1e8"/>
      <stop offset="100%" stop-color="#c9a961"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a961" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c9a961" stop-opacity="0"/>
    </linearGradient>
    <style>
      .pulse { transform-origin: 1000px 186px; animation: p 3.2s ease-in-out infinite; }
      .flow  { stroke-dasharray: 4 7; animation: f 2.4s linear infinite; }
      @keyframes p { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 0; transform: scale(2.4); } }
      @keyframes f { to { stroke-dashoffset: -22; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .flow { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="240" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="239" rx="14" fill="none" stroke="#24232c"/>

  <!-- one coordinator, calls in one direction: the shape of the work -->
  <g stroke="#3a3a47" stroke-width="1" fill="none">
    <path class="flow" d="M1000 186 L862 170"/><path class="flow" d="M1000 186 L1138 170"/>
    <path d="M1000 186 L930 222"/><path d="M1000 186 L1072 222"/>
  </g>
  <g fill="#5a5a68">
    <circle cx="930" cy="222" r="2.6"/><circle cx="1072" cy="222" r="2.6"/>
  </g>
  <circle cx="862" cy="170" r="3.4" fill="#6cb6ff"/>
  <circle cx="1138" cy="170" r="3.4" fill="#e857c3"/>
  <circle class="pulse" cx="1000" cy="186" r="6" fill="#c9a961"/>
  <circle cx="1000" cy="186" r="4.6" fill="#c9a961"/>

  <text x="56" y="58" font-family="'Segoe UI', -apple-system, Verdana, sans-serif" font-weight="600" font-size="12.5" letter-spacing="4.2" fill="#c9a961">AGENT INFRASTRUCTURE · MCP · DEVELOPER TOOLING</text>

  <text x="53" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="url(#nameGrad)" letter-spacing="0.5">Furki Özkan</text>

  <text x="56" y="152" font-family="'Segoe UI', -apple-system, Verdana, sans-serif" font-size="17" fill="#cfcabe">I build what AI agents run on — and the tools that check it actually works.</text>

  <!-- the one call to action, inside the first thing anyone sees -->
  <g font-family="'Segoe UI', -apple-system, Verdana, sans-serif" font-size="13">
    <rect x="56" y="178" width="332" height="30" rx="15" fill="#12261b" stroke="#1f4a31"/>
    <circle cx="76" cy="193" r="4.5" fill="#4ade9e"/>
    <text x="90" y="197.5" fill="#b9e8cf">Available for remote contract work · UTC+3</text>
  </g>

  <g font-family="'Cascadia Code', 'SF Mono', Consolas, monospace">
    <g>
      <rect x="878" y="40" width="120" height="64" rx="10" fill="#141419" stroke="#2a2a33"/>
      <text x="896" y="72" fill="#c9a961" font-size="22" id="sayi-repos">28<tspan
        fill="#9a9aa6" font-size="13" dx="7">repos</tspan></text>
      <text x="896" y="91" fill="#6f6f7b" font-size="11">26 with suites</text>
    </g>
    <g>
      <rect x="1008" y="40" width="150" height="64" rx="10" fill="#141419" stroke="#2a2a33"/>
      <text x="1026" y="72" fill="#4ade9e" font-size="22" id="sayi-tests">5,247<tspan
        fill="#9a9aa6" font-size="13" dx="7">tests</tspan></text>
      <text x="1026" y="91" fill="#6f6f7b" font-size="11">each count traced</text>
    </g>
  </g>
</svg>
