<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="turkce-ajanlar — Claude Code icin Turkce alt-ajan seti">
  <defs>
    <style>
      /* gomulu font yok */
      .baslik { font-family: ui-monospace, monospace; font-weight: 400; }
      .metin  { font-family: ui-monospace, monospace; font-weight: 400; }
    </style>
    <linearGradient id="cizgi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#e08c62" stop-opacity="0"/>
      <stop offset=".18" stop-color="#e08c62" stop-opacity=".9"/>
      <stop offset=".82" stop-color="#e08c62" stop-opacity=".9"/>
      <stop offset="1"   stop-color="#e08c62" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#16150f"/>

  <!-- ince cerceve -->
  <rect x="40" y="34" width="1120" height="252" rx="14" fill="#1f1e18" stroke="#33312a" stroke-width="1"/>

  <!-- ust vurgu cizgisi -->
  <rect x="40" y="34" width="1120" height="2" fill="url(#cizgi)"/>

  <!-- istem satiri -->
  <text class="metin" x="72" y="96" font-size="15" fill="#a09a8c">$ claude</text>

  <!-- baslik -->
  <text class="baslik" x="72" y="152" font-size="42" fill="#eeece4" letter-spacing="-1">turkce-ajanlar</text>

  <!-- alt baslik -->
  <text class="metin" x="72" y="190" font-size="17" fill="#a09a8c">Claude Code icin Turkce alt-ajan seti</text>

  <!-- ayrac -->
  <rect x="72" y="212" width="1056" height="1" fill="#33312a"/>

  <!-- ajan noktalari -->
  <circle cx="72" cy="243" r="5.5" fill="#8b6bb1"/>
    <circle cx="98" cy="243" r="5.5" fill="#4a7fb5"/>
    <circle cx="124" cy="243" r="5.5" fill="#5a9367"/>
    <circle cx="150" cy="243" r="5.5" fill="#4a9ba5"/>
    <circle cx="176" cy="243" r="5.5" fill="#c67b3f"/>
    <circle cx="202" cy="243" r="5.5" fill="#c9a227"/>
    <circle cx="228" cy="243" r="5.5" fill="#b5544a"/>
    <circle cx="254" cy="243" r="5.5" fill="#8a8578"/>

  <text class="metin" x="288" y="248" font-size="14" fill="#a09a8c">71 ajan</text>

  <!-- sag taraf: ayirt edici ozellik -->
  <text class="metin" x="1128" y="248" font-size="14" fill="#e08c62" text-anchor="end">ciktilar Turkce · bulgu sismez</text>
</svg>
